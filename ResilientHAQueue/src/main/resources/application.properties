spring.application.name=resilient-ha-oci-queue
spring.main.web-application-type=none

# Supply OCIDs/endpoints via environment variables or an external secret/config store.
# Do not commit credentials, OCIDs, or queue state to the repository.
oci.queue.config-file=${OCI_CONFIG_FILE:${user.home}/.oci/config}
oci.queue.profile=${OCI_CONFIG_PROFILE:DEFAULT}
oci.queue.primary.queue-id=${OCI_QUEUE_PRIMARY_ID:}
oci.queue.primary.endpoint=${OCI_QUEUE_PRIMARY_ENDPOINT:}
oci.queue.primary.consumer-group-id=${OCI_QUEUE_PRIMARY_CONSUMER_GROUP_ID:}
oci.queue.secondary.queue-id=${OCI_QUEUE_SECONDARY_ID:}
oci.queue.secondary.endpoint=${OCI_QUEUE_SECONDARY_ENDPOINT:}
oci.queue.secondary.consumer-group-id=${OCI_QUEUE_SECONDARY_CONSUMER_GROUP_ID:}

# OCI GetMessages supports long polling for up to 30 seconds.
oci.queue.consumer.enabled=${OCI_QUEUE_CONSUMER_ENABLED:false}
oci.queue.consumer.batch-size=${OCI_QUEUE_BATCH_SIZE:10}
oci.queue.consumer.poll-timeout-seconds=${OCI_QUEUE_POLL_TIMEOUT_SECONDS:30}
oci.queue.consumer.visibility-timeout-seconds=${OCI_QUEUE_VISIBILITY_TIMEOUT_SECONDS:60}
oci.queue.retry.max-attempts=${OCI_QUEUE_RETRY_MAX_ATTEMPTS:3}
oci.queue.retry.initial-delay-ms=${OCI_QUEUE_RETRY_INITIAL_DELAY_MS:250}
oci.queue.retry.max-delay-ms=${OCI_QUEUE_RETRY_MAX_DELAY_MS:5000}

management.endpoints.web.exposure.include=health,info,metrics
